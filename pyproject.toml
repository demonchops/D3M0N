[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d3m0n"
version = "0.1.0"
description = "Authorization-gated autonomous red-team agent powered by Claude"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "dnspython>=2.6.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
]

[project.scripts]
d3m0n = "d3m0n.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
